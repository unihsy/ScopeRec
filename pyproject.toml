[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoperec"
version = "0.1.0"
description = "Output-prefix-scoped adaptation for cold-start generative recommendation"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.26,<2",
    "pyarrow>=19,<20",
    "duckdb>=1.3,<2",
    "requests>=2.32.5,<3",
]

[project.optional-dependencies]
ml = [
    "torch>=2.6,<3",
    "faiss-cpu==1.11.0",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.10,<4",
    "transformers>=4.57,<5",
    "sentence-transformers>=5.2,<6",
    "accelerate>=1.10,<2",
    "huggingface-hub>=0.34,<1",
]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[project.scripts]
scoperec = "scoperec.cli:main"

[project.urls]
Repository = "https://github.com/unihsy/ScopeRec"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]