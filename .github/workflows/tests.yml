name: Offline Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[ml,dev]'
      - run: python -m pytest -q
        env:
          OMP_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '1'
      - run: python -m ruff check src scripts tests
      - run: python -m scoperec results verify
      - run: python -m scoperec --help
      - run: bash -n scripts/bootstrap_environment.sh scripts/reproduce.sh scripts/reproduce_v2.sh scripts/reproduce_official.sh